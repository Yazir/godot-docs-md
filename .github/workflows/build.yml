name: build

on:
  schedule:
    - cron: "0 4 * * 1" # weekly; cron only serves patch-drift of the pinned version
  workflow_dispatch:
    inputs:
      version:
        description: "Version branch, e.g. 4.7"
        required: false
        default: "4.7"
      force:
        description: "Rebuild even if SHAs unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.version || '4.7' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || '4.7' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build package
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/build.sh "$VERSION" ${{ inputs.force && '--force' || '' }}

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f "dist/godot-$VERSION-md.tar.gz" ]; then
            echo "No package produced (upstream SHAs unchanged); nothing to release."
            exit 0
          fi
          TAG=$(grep '^release: ' "versions/$VERSION.md" | cut -d' ' -f2)
          GODOT_SHA=$(grep '^godot_sha: ' "versions/$VERSION.md" | cut -d' ' -f2)
          DOCS_SHA=$(grep '^godot_docs_sha: ' "versions/$VERSION.md" | cut -d' ' -f2)

          # release pinned to the exact upstream SHAs
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" \
            "dist/godot-$VERSION-md.tar.gz" "dist/SHA256SUMS" \
            --title "Godot $VERSION documentation (Markdown)" \
            --notes "Markdown documentation package for Godot $VERSION, built from godot@$GODOT_SHA and godot-docs@$DOCS_SHA."

          # re-point the rolling tag to the newest release
          gh release delete "godot-$VERSION-md-latest" -y --cleanup-tag || true
          gh release create "godot-$VERSION-md-latest" \
            "dist/godot-$VERSION-md.tar.gz" "dist/SHA256SUMS" \
            --title "Godot $VERSION documentation (Markdown, latest)" \
            --notes "Rolling latest build for Godot $VERSION, built from godot@$GODOT_SHA and godot-docs@$DOCS_SHA."

      - name: Record build
        run: |
          set -euo pipefail
          TAG=$(grep '^release: ' "versions/$VERSION.md" | cut -d' ' -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "versions/$VERSION.md"
          if git diff --cached --quiet; then
            echo "versions/$VERSION.md unchanged"
          else
            git commit -m "[skip ci] record build $TAG"
            git push
          fi
