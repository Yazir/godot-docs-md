name: build

on:
  schedule:
    - cron: "0 4 * * 1" # weekly; serves patch-drift of tracked versions and picks up new version branches
  workflow_dispatch:
    inputs:
      version:
        description: "Version branch, e.g. 4.7 (empty: drift-check all tracked versions + adopt newly discovered ones)"
        required: false
        default: ""
      force:
        description: "Rebuild even if SHAs unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: build-${{ inputs.version || 'auto' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          FORCE_FLAG="${{ inputs.force && '--force' || '' }}"
          failed=""
          if [ -n "$VERSION_INPUT" ]; then
            tools/build.sh "$VERSION_INPUT" $FORCE_FLAG || {
              echo "::error::build failed for $VERSION_INPUT"
              exit 1
            }
          else
            # one tracked branch per major line: drift check + branch bumps
            # (e.g. 4.7 -> 4.8) + new majors (5.x), all handled by build.sh
            for v in $(tools/discover_versions.sh); do
              echo "=== checking $v"
              tools/build.sh "$v" $FORCE_FLAG || {
                echo "::warning::build failed for $v"
                failed="$failed $v"
              }
            done
          fi
          if [ -n "$failed" ]; then
            echo "::warning::failed versions:$failed"
            ls dist/godot-*-md.tar.gz >/dev/null 2>&1 || exit 1
          fi

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tarball in dist/godot-*-md.tar.gz; do
            line="$(basename "$tarball")"
            line="${line#godot-}"; line="${line%-md.tar.gz}"
            RECORD="versions/$line.md"
            [ -f "$RECORD" ] || { echo "::warning::no record for $line"; continue; }
            TAG=$(grep '^release: ' "$RECORD" | cut -d' ' -f2)
            DOCS_SHA=$(grep '^godot_docs_sha: ' "$RECORD" | cut -d' ' -f2)
            BRANCH=$(grep '^branch: ' "$RECORD" | cut -d' ' -f2)
            echo "=== publishing $TAG (branch $BRANCH)"
            tmpd="$(mktemp -d)"
            cp "$tarball" "$tmpd/godot-$line-md.tar.gz"
            (cd "$tmpd" && sha256sum "godot-$line-md.tar.gz" > SHA256SUMS)
            gh release delete "$TAG" -y --cleanup-tag || true
            gh release create "$TAG" "$tmpd/godot-$line-md.tar.gz" "$tmpd/SHA256SUMS" \
              --title "Godot $line documentation (Markdown, latest)" \
              --notes "Rolling latest Markdown documentation package for Godot $line (currently $BRANCH), built from godot-docs@$DOCS_SHA."
            rm -rf "$tmpd"
          done

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site-root
        continue-on-error: true

      - name: Deploy docs browser to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist site-root
          # backfill packages for recorded lines that did not build this run
          for f in versions/*.md; do
            v="$(basename "$f" .md)"
            if [ ! -d "dist/package-$v/godot-$v-md" ]; then
              echo "=== fetching latest package for $v"
              mkdir -p "dist/package-$v"
              gh release download "godot-$v-md-latest" -R "$GITHUB_REPOSITORY" \
                -p "godot-$v-md.tar.gz" -O "dist/package-$v/pkg.tar.gz" \
                || { echo "::warning::no release for $v, skipping site"; continue; }
              tar -xzf "dist/package-$v/pkg.tar.gz" -C "dist/package-$v"
            fi
          done
          cd site-root
          if [ ! -d .git ]; then
            git init -q -b gh-pages
            git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          fi
          for pkg in ../dist/package-*/godot-*-md; do
            name="$(basename "$pkg")"
            line="${name#godot-}"; line="${line%-md}"
            echo "=== building site for $line"
            python3 ../tools/build_site.py build --input "$pkg" --output "$line"
          done
          python3 ../tools/build_site.py root --output .
          git add -A
          tags=$(ls -d */ 2>/dev/null | tr -d / | paste -sd, -)
          if git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "[skip ci] site update for $tags"; then
            git push -q origin HEAD:gh-pages
          else
            echo "site unchanged"
          fi

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
            -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 \
            && echo "Pages enabled" \
            || echo "::warning::could not enable Pages automatically (enable it once in Settings → Pages → source: gh-pages)"

      - name: Record builds
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/
          if git diff --cached --quiet; then
            echo "versions/ unchanged"
          else
            tags=$(grep -h '^release: ' versions/*.md | cut -d' ' -f2 | paste -sd, -)
            git commit -m "[skip ci] record build $tags"
            git push
          fi
